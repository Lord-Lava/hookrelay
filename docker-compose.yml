name: hookrelay

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hookrelay}
      POSTGRES_USER: ${POSTGRES_USER:-hookrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hookrelay]

  rabbitmq:
    image: rabbitmq:4.4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-hookrelay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local_only_change_me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq-management.conf:/etc/rabbitmq/conf.d/99-management-listener.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [hookrelay]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY:?Set a base64-encoded 32-byte signing encryption key}
      SIGNING_KEY_VERSION: ${SIGNING_KEY_VERSION:-v1}
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hookrelay}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hookrelay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-hookrelay}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-local_only_change_me}
      HOOKRELAY_DEV_API_KEY: ${HOOKRELAY_DEV_API_KEY:-hr_live_localdev_development_only_change_me}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hookrelay]

networks:
  hookrelay:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
