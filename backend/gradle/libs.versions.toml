[versions]
spring-boot = "4.2.0"
spotless = "8.11.0"
google-java-format = "2.0.0"
owasp-dependency-check = "13.0.0"
cyclonedx = "3.6.1"
# Lombok is not managed by the Spring Boot BOM; pinned explicitly (AGENTS.md 4.2 allows a
# documented, explicit version for non-BOM-managed libraries).
lombok = "1.18.48"
# Security override: amqp-client pinned to 5.34.0 (see build.gradle.kts).
rabbitmqAmqpClient = "5.34.0"
# Apache HttpClient 5 for SSRF-safe outbound webhook delivery (Step 3).
apacheHttpClient5 = "5.6.5"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependency-check = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependency-check" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
